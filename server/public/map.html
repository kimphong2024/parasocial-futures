<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Map — Futures of Parasocial AI</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/fib.css">
  <link rel="stylesheet" href="/css/motion.css">
  <style>
    .map-shell { position: relative; height: calc(100vh - 150px); min-height: 520px; margin-top: 8px; }
    #mapCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; border-radius: var(--r-box); background: #F7F2E2; border: 1px solid #E2DBC2; }
    #mapCanvas.dragging { cursor: grabbing; }
    .map-controls {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 10px 0;
    }
    .map-legend { display: flex; gap: 14px; align-items: center; font-size: 11px; color: var(--chart-mid, #6B6852); flex-wrap: wrap; }
    .map-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .map-tip {
      position: absolute; pointer-events: none; display: none;
      max-width: 320px; padding: 8px 12px;
      background: var(--paperWhite, #FFFEF9); border: 1px solid #D8D2BC;
      box-shadow: 0 6px 22px rgba(19, 19, 9, 0.14);
      border-radius: var(--r-sm); font-size: 12px; line-height: 1.5; color: var(--ink, #131309);
      z-index: 5;
    }
    .map-panel {
      position: absolute; top: 14px; right: 14px; width: min(340px, 42%);
      max-height: calc(100% - 28px); overflow-y: auto;
      background: rgba(255, 254, 249, 0.96); border: 1px solid #E2DBC2; color: #131309;
      border-radius: var(--r-box); padding: 16px; z-index: 4;
      display: none;
    }
    .map-panel h4 { font-size: 15px; line-height: 1.4; margin-bottom: 8px; }
    .map-panel .close { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--textDim); font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main class="container" style="padding-top:12px">
    <div class="page-head">
      <span class="label">Signal Map</span>
      <h2>The library as one field</h2>
      <p class="subtitle">Every approved signal, connected to its nearest semantic neighbours by embedding similarity, settled by a 3D physics simulation. Clusters emerge from the connections rather than being drawn — drag to orbit, scroll to zoom, click a node to read it.</p>
    </div>
    <div class="map-controls">
      <select id="mode">
        <option value="all">Whole — all connections</option>
        <option value="bridge">Bridges — links between different clusters</option>
        <option value="within">Kinship — links within a cluster</option>
      </select>
      <select id="clusterSel"><option value="">Highlight a cluster…</option></select>
      <input type="search" id="q" placeholder="Find signals…" style="flex:0 1 220px">
      <span class="map-legend" id="legend"></span>
      <span class="caption" id="mapStats"></span>
    </div>
    <div class="map-shell">
      <canvas id="mapCanvas"></canvas>
      <div class="map-tip" id="tip"></div>
      <aside class="map-panel" id="panel" data-lenis-prevent></aside>
    </div>
  </main>
  <script src="/js/vendor/d3.min.js"></script>
  <script src="/js/vendor/d3-binarytree.min.js"></script>
  <script src="/js/vendor/d3-octree.min.js"></script>
  <script src="/js/vendor/d3-force-3d.min.js"></script>
  <script type="module" src="/js/map.js"></script>
  <script src="/js/vendor/lenis.min.js"></script>
  <script type="module" src="/js/motion.js"></script>
</body>
</html>
